version: '3.8'

services:
  # 1. Aplicação Web PlayAuge / GPSMusic (Frontend Nginx)
  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - SERVICE_FQDN_WEB
      - DATABASE_URL=postgresql://${POSTGRES_USER:-playauge_user}:${POSTGRES_PASSWORD:-playauge_pass}@postgres:5432/${POSTGRES_DB:-playauge_db}
    depends_on:
      - postgres

  # 2. Banco de Dados PostgreSQL Automático
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-playauge_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-playauge_pass}
      POSTGRES_DB: ${POSTGRES_DB:-playauge_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro

volumes:
  postgres_data:
    driver: local
