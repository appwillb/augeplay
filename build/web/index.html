<!DOCTYPE html>
<html>
<head>
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="PlayAuge - Plataforma Musical e Contratação Direta">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="playauge">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <meta name="theme-color" content="#0B0C10">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />

  <style>
    html, body {
      background-color: #0B0C10 !important;
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow-x: hidden;
    }
  </style>

  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>

  <script>
    // Limpa service workers antigos e cache local
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(registrations) {
        for(var i = 0; i < registrations.length; i++) {
          registrations[i].unregister();
        }
      });
    }
    if ('caches' in window) {
      caches.keys().then(function(names) {
        for (var i = 0; i < names.length; i++) {
          caches.delete(names[i]);
        }
      });
    }

    // Serviço de Sinalização Universal e Chamadas em Tempo Real
    window.playaugeCallService = {
      peer: null,
      currentUserId: null,
      eventSource: null,
      init: function(userId) {
        if (!userId) return;
        this.currentUserId = String(userId);
        var cleanId = 'playauge_' + String(userId).replace(/[^a-zA-Z0-9_]/g, '_');
        var self = this;
        
        // 1. Cloud SSE (ntfy.sh) - Funciona entre qualquer aparelho, aba anônima, 4G, Wi-Fi no mundo
        try {
          if (this.eventSource) this.eventSource.close();
          this.eventSource = new EventSource('https://ntfy.sh/' + cleanId + '/sse');
          this.eventSource.onmessage = function(e) {
            try {
              var ntfyData = JSON.parse(e.data);
              if (ntfyData.event === 'message' && ntfyData.message) {
                var payload = JSON.parse(ntfyData.message);
                console.log('[PlayAuge Cloud SSE] Mensagem recebida:', payload);
                self.handleMessage(payload);
              }
            } catch(err) {}
          };
        } catch(e) {
          console.warn('[PlayAuge SSE Error]', e);
        }

        // 2. PeerJS com STUN Google
        function connectPeer() {
          if (typeof Peer !== 'undefined') {
            try {
              if (self.peer) self.peer.destroy();
              self.peer = new Peer(cleanId, {
                config: {
                  iceServers: [
                    { urls: 'stun:stun.l.google.com:19302' },
                    { urls: 'stun:stun1.l.google.com:19302' }
                  ]
                }
              });
              self.peer.on('open', function(id) {
                console.log('[PlayAuge WebRTC] Peer pronto para chamadas:', id);
              });
              self.peer.on('connection', function(conn) {
                conn.on('data', function(data) {
                  console.log('[PlayAuge WebRTC] Mensagem recebida via Peer:', data);
                  self.handleMessage(data);
                });
              });
              self.peer.on('error', function(err) {
                console.warn('[PlayAuge WebRTC] Peer status:', err);
              });
            } catch(e) {
              console.warn('[PlayAuge WebRTC] Init error:', e);
            }
          }
        }
        
        connectPeer();
        if (!self.peer) {
          setTimeout(connectPeer, 1500);
        }
      },
      callUser: function(targetUserId, callerData) {
        var cleanTarget = 'playauge_' + String(targetUserId).replace(/[^a-zA-Z0-9_]/g, '_');
        var parsedCaller = typeof callerData === 'string' ? JSON.parse(callerData) : callerData;
        var payload = {
          type: 'INCOMING_CALL',
          caller: parsedCaller,
          targetUserId: String(targetUserId),
          timestamp: Date.now()
        };
        console.log('[PlayAuge Call] Chamando usuário:', targetUserId, payload);

        // A. Cloud Push (dispositivos diferentes / internet)
        try {
          fetch('https://ntfy.sh/' + cleanTarget, {
            method: 'POST',
            body: JSON.stringify(payload)
          }).catch(function() {});
        } catch(e) {}

        // B. BroadcastChannel (mesmo navegador / abas)
        if (window.BroadcastChannel) {
          try { 
            var bc = new BroadcastChannel('playauge_call_channel');
            bc.postMessage(payload);
          } catch(e) {}
        }
        // C. localStorage (outras abas / persistente)
        try { 
          localStorage.setItem('playauge_call_event', JSON.stringify(payload)); 
        } catch(e) {}
        // D. PeerJS (computador para celular / internet)
        if (this.peer) {
          try {
            var conn = this.peer.connect(cleanTarget);
            conn.on('open', function() {
              conn.send(payload);
            });
          } catch(e) {}
        }
      },
      answerCall: function(targetUserId) {
        var cleanTarget = 'playauge_' + String(targetUserId).replace(/[^a-zA-Z0-9_]/g, '_');
        var payload = { type: 'CALL_ANSWERED', targetUserId: String(targetUserId), timestamp: Date.now() };
        try {
          fetch('https://ntfy.sh/' + cleanTarget, { method: 'POST', body: JSON.stringify(payload) }).catch(function() {});
        } catch(e) {}
        if (window.BroadcastChannel) {
          try { new BroadcastChannel('playauge_call_channel').postMessage(payload); } catch(e) {}
        }
        try { localStorage.setItem('playauge_call_event', JSON.stringify(payload)); } catch(e) {}
        if (this.peer) {
          try {
            var conn = this.peer.connect(cleanTarget);
            conn.on('open', function() { conn.send(payload); });
          } catch(e) {}
        }
      },
      endCall: function(targetUserId) {
        var cleanTarget = 'playauge_' + String(targetUserId).replace(/[^a-zA-Z0-9_]/g, '_');
        var payload = { type: 'CALL_ENDED', targetUserId: String(targetUserId), timestamp: Date.now() };
        try {
          fetch('https://ntfy.sh/' + cleanTarget, { method: 'POST', body: JSON.stringify(payload) }).catch(function() {});
        } catch(e) {}
        if (window.BroadcastChannel) {
          try { new BroadcastChannel('playauge_call_channel').postMessage(payload); } catch(e) {}
        }
        try { localStorage.setItem('playauge_call_event', JSON.stringify(payload)); } catch(e) {}
        if (this.peer) {
          try {
            var conn = this.peer.connect(cleanTarget);
            conn.on('open', function() { conn.send(payload); });
          } catch(e) {}
        }
      },
      handleMessage: function(data) {
        if (!data) return;
        console.log('[PlayAuge Call] handleMessage:', data, 'meu ID atual:', this.currentUserId);
        if (data.type === 'INCOMING_CALL' && String(data.targetUserId) === String(this.currentUserId)) {
          if (window.onPlayaugeIncomingCall) {
            window.onPlayaugeIncomingCall(typeof data.caller === 'string' ? data.caller : JSON.stringify(data.caller));
          }
        } else if (data.type === 'CALL_ANSWERED') {
          if (window.onPlayaugeCallAnswered) {
            window.onPlayaugeCallAnswered();
          }
        } else if (data.type === 'CALL_ENDED') {
          if (window.onPlayaugeCallEnded) {
            window.onPlayaugeCallEnded();
          }
        }
      }
    };

    if (window.BroadcastChannel) {
      try {
        var bc = new BroadcastChannel('playauge_call_channel');
        bc.onmessage = function(ev) {
          window.playaugeCallService.handleMessage(ev.data);
        };
      } catch(e) {}
    }

    window.addEventListener('storage', function(ev) {
      if (ev.key === 'playauge_call_event' && ev.newValue) {
        try {
          var data = JSON.parse(ev.newValue);
          window.playaugeCallService.handleMessage(data);
        } catch(e) {}
      }
    });
  </script>

  <title>playauge</title>
  <link rel="manifest" href="manifest.json">
</head>

</html>
