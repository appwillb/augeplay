server {
    listen 80;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/x-javascript
        application/javascript
        application/xml
        application/json
        image/svg+xml;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Never cache HTML or Service Worker or Bootstrap scripts
    location ~* (index\.html|flutter_bootstrap\.js|flutter_service_worker\.js|version\.json)$ {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        expires -1;
    }

    # Main application bundle - do not cache aggressively
    location ~* (main\.dart\.js)$ {
        add_header Cache-Control "no-cache, must-revalidate" always;
        expires 0;
    }

    # Static assets (images, fonts, audio)
    location ~* \.(?:ico|css|gif|jpe?g|png|woff2?|eot|ttf|svg|mp3|wav|ogg)$ {
        expires 1d;
        access_log off;
        add_header Cache-Control "public, max-age=86400";
    }

    # Flutter Web SPA fallback
    location / {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        try_files $uri $uri/ /index.html;
    }

    # Error pages
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
